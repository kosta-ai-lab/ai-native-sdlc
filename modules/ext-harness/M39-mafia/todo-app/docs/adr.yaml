# todo-app Architecture Decision Records (mafia-codereview 실습용 가상 기록)
# 스키마: id / title / status / date / stacks / context / decision / consequence

- id: ADR-001
  title: 할 일 저장소는 JSON 파일 하나로 한다
  status: adopted
  date: 2026-09-01
  stacks: [node]
  context: |
    처음에는 SQLite 를 검토했지만 네이티브 모듈 설치가 Windows 실습 환경에서 자주 실패했다.
    할 일 개수는 사용자당 수십 개 수준이라 검색 성능이 문제 되지 않았고,
    수강생이 저장된 데이터를 텍스트 편집기로 바로 열어 볼 수 있어야 했다.
  decision: 모든 할 일을 todos.json 파일 하나에 배열로 저장한다. 변경 시 파일 전체를 읽고 전체를 다시 쓴다.
  consequence: 여러 프로세스가 동시에 쓰는 경우는 지원하지 않는다. 할 일 객체에 필드를 추가하면 기존 파일에 그 필드가 없을 수 있으므로 읽는 쪽에서 기본값을 처리해야 한다.

- id: ADR-002
  title: 날짜는 시간대 없는 "YYYY-MM-DD" 문자열로 다룬다
  status: adopted
  date: 2026-09-15
  stacks: [node]
  context: |
    초기 버전은 마감일을 Date 객체로 만들어 JSON 에 저장했다.
    JSON 으로 직렬화되면서 UTC 시각 문자열로 바뀌었고, 한국 시간 2026-09-10 00:30 에 만든 할 일의 마감일이
    목록에 2026-09-09 로 표시되는 버그가 두 번 신고되었다.
    시간대에 따라 하루씩 밀리는 문제는 테스트 환경(UTC)에서는 재현되지 않아 찾는 데 오래 걸렸다.
  decision: 마감일은 항상 "YYYY-MM-DD" 문자열로 저장하고 비교한다. 날짜 더하기 같은 계산이 필요하면 UTC 기준(Date.UTC, getUTCDate 등)으로 계산한 뒤 즉시 문자열로 되돌린다.
  consequence: 로컬 시간 함수(new Date("YYYY-MM-DD") 후 getDate/setDate 등)로 날짜를 계산하는 코드는 리뷰에서 거부한다. 월말·연말을 넘는 날짜는 테스트로 확인한다.

- id: ADR-003
  title: 웹 화면의 할 일 목록 상태는 서버에서 받은 값을 그대로 쓴다
  status: adopted
  date: 2026-10-01
  stacks: [web]
  context: |
    웹 버전 시안에서 브라우저에 목록을 따로 저장해 두었더니, 다른 탭에서 완료한 할 일이
    새로고침 전까지 미완료로 보이는 문제가 있었다.
  decision: 웹 화면은 할 일 목록을 브라우저에 캐시하지 않고, 화면을 그릴 때마다 서버 응답을 그대로 사용한다.
  consequence: 오프라인 사용은 지원하지 않는다. (현재 CLI 버전과는 관계없다.)
